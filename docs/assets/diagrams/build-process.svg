<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1050" role="img" aria-labelledby="title description">
  <title id="title">The human and agent development workflow</title>
  <desc id="description">Idea and brief, object modeling and planning with human architecture review, issues and implementation, validation and pull request, independent review, human review, human merge, then a separate release decision. Findings and requested changes return to repair, validation, and fresh review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#234b46"/>
    </marker>
  </defs>
  <rect width="360" height="1050" rx="12" fill="#fff"/>
  <g fill="none" stroke="#234b46" stroke-width="2" marker-end="url(#arrow)">
    <path d="M156 100 V138"/>
    <path d="M156 230 V268"/>
    <path d="M156 350 V388"/>
    <path d="M156 470 V508"/>
    <path d="M156 590 V628"/>
    <path d="M156 710 V748"/>
    <path d="M156 830 V868"/>
    <path d="M284 550 H310 V430 H284"/>
    <path d="M284 670 H310 V550"/>
  </g>
  <g fill="#f1f6f4" stroke="#234b46" stroke-width="1.5">
    <rect x="28" y="20" width="256" height="80" rx="8"/>
    <rect x="28" y="140" width="256" height="90" rx="8"/>
    <rect x="28" y="270" width="256" height="80" rx="8"/>
    <rect x="28" y="390" width="256" height="80" rx="8"/>
    <rect x="28" y="510" width="256" height="80" rx="8"/>
    <rect x="28" y="630" width="256" height="80" rx="8"/>
    <rect x="28" y="750" width="256" height="80" rx="8"/>
    <rect x="28" y="870" width="256" height="80" rx="8"/>
  </g>
  <g fill="#173d37" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">
    <text x="156" y="67">Idea + brief</text>
    <text x="156" y="168">Objects + planning</text>
    <text x="156" y="195" font-size="15">Human architecture review</text>
    <text x="156" y="217" font-size="15">before implementation</text>
    <text x="156" y="306">Work issues</text>
    <text x="156" y="332">Agent implementation</text>
    <text x="156" y="426">Validation</text>
    <text x="156" y="452">Pull request</text>
    <text x="156" y="546">Independent review</text>
    <text x="156" y="572" font-size="15">Review the complete change</text>
    <text x="156" y="666">Human review</text>
    <text x="156" y="692" font-size="15">Request changes or accept</text>
    <text x="156" y="786">Human merge</text>
    <text x="156" y="812" font-size="15">Michelle's decision</text>
    <text x="156" y="906">Release decision</text>
    <text x="156" y="932" font-size="15">Separate human decision</text>
    <text transform="translate(339 552) rotate(-90)" font-size="16">Findings → repair → revalidate</text>
    <text x="180" y="993" font-size="16">An evolving process.</text>
    <text x="180" y="1018" font-size="16">Agents do not merge or release.</text>
  </g>
</svg>
